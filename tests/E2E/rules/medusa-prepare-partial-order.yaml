steps: |
  medusa-e2e-api-sign-in
  generate from regex "[a-z]{16}", and save as "caseSuffix"
  save string with parameters "e2etc09-${caseSuffix}" as "partialProduct"
  save string with parameters "e2etc09-${caseSuffix}@medusa-e2e.test" as "partialEmail"
  save string with parameters "${e2eApiBase}/admin/inventory-items" as "apiUrl"
  save string with parameters "{\"title\":\"${partialProduct}\",\"sku\":\"${partialProduct}\",\"metadata\":{\"e2e_owner\":\"medusa-admin-e2e-08-09\",\"e2e_case\":\"TC-09\",\"e2e_run\":\"${caseSuffix}\"}}" as "requestBody"
  call api post stored value "apiUrl" with headers "Content-Type:application/json" and stored value "apiAuthorization" and body stored value "requestBody" and get "$.inventory_item.id" and save it as "partialInventoryId" and then check that http code is 200
  save string with parameters "${e2eApiBase}/admin/inventory-items/${partialInventoryId}/location-levels" as "apiUrl"
  save string with parameters "{\"location_id\":\"${e2eFulfillmentLocationId}\",\"stocked_quantity\":10}" as "requestBody"
  call api post stored value "apiUrl" with headers "Content-Type:application/json" and stored value "apiAuthorization" and body stored value "requestBody" and then check that http code is 200
  save string with parameters "${e2eApiBase}/admin/products" as "apiUrl"
  save string with parameters "{\"title\":\"${partialProduct}\",\"handle\":\"${partialProduct}\",\"status\":\"published\",\"discountable\":true,\"shipping_profile_id\":\"${e2eShippingProfileId}\",\"sales_channels\":[{\"id\":\"${e2eOrderChannelId}\"}],\"options\":[{\"title\":\"Default\",\"values\":[\"Default\"]}],\"variants\":[{\"title\":\"Default\",\"sku\":\"${partialProduct}\",\"manage_inventory\":true,\"prices\":[{\"currency_code\":\"eur\",\"amount\":25}],\"options\":{\"Default\":\"Default\"},\"inventory_items\":[{\"inventory_item_id\":\"${partialInventoryId}\",\"required_quantity\":1}]}],\"metadata\":{\"e2e_owner\":\"medusa-admin-e2e-08-09\",\"e2e_case\":\"TC-09\",\"e2e_run\":\"${caseSuffix}\"}}" as "requestBody"
  call api post stored value "apiUrl" with headers "Content-Type:application/json" and stored value "apiAuthorization" and body stored value "requestBody" and get "$.product.id" and save it as "partialProductId" and then check that http code is 200
  save string with parameters "${e2eApiBase}/admin/products/${partialProductId}?fields=*variants" as "apiUrl"
  call api get stored value "apiUrl" with headers "Content-Type:application/json" and stored value "apiAuthorization" and get "$.product.variants[0].id" and save it as "partialVariantId" and then check that http code is 200
  save string with parameters "${e2eApiBase}/admin/customers" as "apiUrl"
  save string with parameters "{\"email\":\"${partialEmail}\",\"metadata\":{\"e2e_owner\":\"medusa-admin-e2e-08-09\",\"e2e_case\":\"TC-09\",\"e2e_run\":\"${caseSuffix}\"}}" as "requestBody"
  call api post stored value "apiUrl" with headers "Content-Type:application/json" and stored value "apiAuthorization" and body stored value "requestBody" and get "$.customer.id" and save it as "partialCustomerId" and then check that http code is 200
  save string with parameters "${e2eApiBase}/admin/draft-orders" as "apiUrl"
  save string with parameters "{\"region_id\":\"${e2eOrderRegionId}\",\"sales_channel_id\":\"${e2eOrderChannelId}\",\"customer_id\":\"${partialCustomerId}\",\"shipping_address\":{\"first_name\":\"E2E\",\"last_name\":\"TC-09\",\"address_1\":\"1 Test Street\",\"city\":\"Berlin\",\"postal_code\":\"10115\",\"country_code\":\"de\"},\"billing_address\":{\"first_name\":\"E2E\",\"last_name\":\"TC-09\",\"address_1\":\"1 Test Street\",\"city\":\"Berlin\",\"postal_code\":\"10115\",\"country_code\":\"de\"},\"items\":[{\"variant_id\":\"${partialVariantId}\",\"unit_price\":25,\"quantity\":3}],\"no_notification_order\":true,\"metadata\":{\"e2e_owner\":\"medusa-admin-e2e-08-09\",\"e2e_case\":\"TC-09\",\"e2e_run\":\"${caseSuffix}\"},\"shipping_methods\":[{\"name\":\"${e2eShippingOption}\",\"shipping_option_id\":\"${e2eShippingOptionId}\",\"amount\":0}]}" as "requestBody"
  call api post stored value "apiUrl" with headers "Content-Type:application/json" and stored value "apiAuthorization" and body stored value "requestBody" and get "$.draft_order.id" and save it as "partialOrderId" and then check that http code is 200
  save string with parameters "${e2eApiBase}/admin/draft-orders/${partialOrderId}/convert-to-order" as "apiUrl"
  save string with parameters "{}" as "requestBody"
  call api post stored value "apiUrl" with headers "Content-Type:application/json" and stored value "apiAuthorization" and body stored value "requestBody" and then check that http code is 200
  save string with parameters "${e2eApiBase}/admin/orders/${partialOrderId}" as "apiUrl"
  call api get stored value "apiUrl" with headers "Content-Type:application/json" and stored value "apiAuthorization" and get "$.order.display_id" and save it as "partialOrderNumber" and then check that http code is 200
labels:
- medusa-api-fixture
